# Project-wide Gradle settings.

# Increase JVM heap size for the Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use AndroidX instead of the deprecated Support Library
android.useAndroidX=true

# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true

# Avoid duplicate R class generation for faster builds
android.nonTransitiveRClass=true

# Kotlin code style
kotlin.code.style=official

# Enable Gradle's configuration cache for faster builds
org.gradle.parallel=true
org.gradle.caching=true